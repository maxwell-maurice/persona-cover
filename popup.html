<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Extension Popup</title>
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      button {
        padding: 8px 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h2>Hello, Extension!</h2>
    <p>This is your popup UI.</p>
    <button id="actionBtn">Click Me</button>

    <!-- Scripts must be loaded externally in extensions -->
    <script src="popup.js"></script>
  </body>
</html>
